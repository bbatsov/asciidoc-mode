name: CI

on:
  push:
    paths-ignore: ['*.adoc']
  pull_request:
    paths-ignore: ['*.adoc']

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{matrix.emacs_version == 'snapshot'}}

    strategy:
      fail-fast: false
      matrix:
        emacs_version: ['30.2', '31.1', 'snapshot']

    steps:
    - name: Set up Emacs
      uses: purcell/setup-emacs@v8.0
      with:
        version: ${{matrix.emacs_version}}

    - name: Install Eldev
      run: curl -fsSL https://raw.github.com/doublep/eldev/master/webinstall/github-eldev | sh

    - name: Check out the source code
      uses: actions/checkout@v4

    - name: Install Asciidoctor
      run: sudo apt-get update && sudo apt-get install -y asciidoctor

    - name: Install tree-sitter grammars
      run: make grammars

    - name: Compile
      run: eldev compile --warnings-as-errors

    - name: Lint
      run: eldev lint

    - name: Test
      env:
        # Fail instead of skipping most of the suite if the grammars are missing.
        ASCIIDOC_MODE_REQUIRE_GRAMMARS: 1
      run: eldev -dtT test
